[project]
name = "knowledge"
version = "0.1.0"
description = "Aurel knowledge service: document reading, chunking, embeddings, search and the learning engine"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.135.0",
    "en-core-web-lg",
    "fastapi[standard]>=0.142.2",
    "ocrmac>=1.0.1 ; sys_platform == 'darwin'",
    "pillow>=12.3",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5",
    "sentence-transformers>=6.1.0",
    "supabase>=2.32.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "knowledge.main:app"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
